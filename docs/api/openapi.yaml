        **Uloga:** admin
      x-roles: [admin]
      responses:
        '204':
          description: Obrisano
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
