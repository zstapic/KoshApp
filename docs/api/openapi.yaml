  # ---------------------------------------------------------------- Match events
  /matches/{match}/events:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    get:
      tags: [Match events]
      operationId: listMatchEvents
      summary: Povijest događaja (uključujući poništene)
      description: |
        Svi događaji utakmice poredani po `sequence`, bez paginacije. Poništeni
        događaji imaju `is_undone: true`.

        **Uloga:** scorer (samo dodijeljene), admin
      x-roles: [scorer, admin]
      parameters:
        - name: include_undone
          in: query
          description: Uključi poništene događaje
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Događaji
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Match events]
      operationId: createMatchEvent
      summary: Zapis događaja utakmice
      description: |
        Klijent generira `id` (UUID v4). **Idempotentno:**
        - isti `id` s istim sadržajem vraća postojeći događaj sa statusom `200`;
        - isti `id` s drugačijim sadržajem vraća `409 event_id_conflict`.

        Utakmica mora biti `in_progress`, a zahtjev mora doći s tokena koji je
        započeo utakmicu. Server dodjeljuje `sequence` (redni broj).

        ### Obavezna polja po tipu
        | `type` | `team` | `player_id` | `player_out_id` | `coach_id` | `minute` |
        |---|---|---|---|---|---|
        | `score_1`, `score_2`, `score_3` | da | da (na terenu) | - | - | - |
        | `foul_personal`, `foul_technical`, `foul_unsportsmanlike` | da | da (na terenu) | - | - | - |
        | `foul_disqualifying` | da | da **ili** `coach_id` | - | da **ili** `player_id` | - |
        | `foul_coach_technical` (C), `foul_bench_technical` (B) | da | - | - | da | - |
        | `substitution` | da | da (ulazi, s klupe) | da (izlazi, s terena) | - | - |
        | `timeout` | da | - | - | - | da (1-10) |
        | `hcc` | da | - | - | - | opcionalno |
        | `quarter_end` | - | - | - | - | - |

        `player_id` i `coach_id` nikad nisu istovremeno popunjeni.
        `quarter` mora biti jednak trenutnoj četvrtini (5 i više = produžeci).

        ### Pravila igre (server, `409`)
        - Igrač s 5 faulova ili diskvalificirajućim faulom je isključen i ne može
          ni zabilježiti događaj ni ući u igru (`player_disqualified`).
        - Koš i faul igrača samo za igrača na terenu (`player_not_on_court`).
        - Limit timeouta **(pravilo po poluvremenima potvrditi)** (`timeout_limit_reached`).
        - Isključenje trenera prema pravilniku **(potvrditi)** (`coach_disqualified`).
        - Nakon `quarter_end` 4. četvrtine ili produžetka nova četvrtina počinje samo
          ako je rezultat izjednačen; inače se utakmica može samo završiti
          (`match_must_finish`).

        **Uloga:** scorer (samo dodijeljene)
      x-roles: [scorer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
            examples:
              score:
                summary: Koš za 2 boda
                value:
                  id: 3f1c2a8e-7b4d-4e0a-9c55-0b6f1d2e3a41
                  type: score_2
                  team: home
                  player_id: 101
                  quarter: 1
              personal_foul:
                summary: Osobni faul igrača
                value:
                  id: 8a2b9c1d-3e4f-4a5b-8c6d-7e8f9a0b1c2d
                  type: foul_personal
                  team: away
                  player_id: 214
                  quarter: 2
              coach_technical:
                summary: Tehnička greška trenera (C)
                value:
                  id: 0c9d8e7f-6a5b-4c3d-9e2f-1a0b9c8d7e6f
                  type: foul_coach_technical
                  team: home
                  coach_id: 7
                  quarter: 3
              substitution:
                summary: Zamjena
                value:
                  id: 5d4c3b2a-1f0e-4d9c-8b7a-6f5e4d3c2b1a
                  type: substitution
                  team: home
                  player_id: 108
                  player_out_id: 101
                  quarter: 2
              timeout:
                summary: Timeout u 7. minuti
                value:
                  id: 9e8d7c6b-5a4f-4e3d-a2c1-b0a9f8e7d6c5
                  type: timeout
                  team: away
                  quarter: 4
                  minute: 7
              quarter_end:
                summary: Kraj četvrtine
                value:
                  id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                  type: quarter_end
                  quarter: 1
      responses:
        '201':
          description: Događaj zapisan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCreatedResponse'
        '200':
          description: Događaj s tim `id` već postoji (ponovljeni zahtjev), vraća se postojeći
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCreatedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Događaj nije dopušten u trenutnom stanju utakmice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_in_progress:
                  value:
                    message: Utakmica nije u tijeku.
                    code: match_not_in_progress
                locked:
                  value:
                    message: Utakmicu vodi drugi uređaj.
                    code: match_locked
                disqualified:
                  value:
                    message: Igrač broj 7 je isključen.
                    code: player_disqualified
                not_on_court:
                  value:
                    message: Igrač broj 12 nije na terenu.
                    code: player_not_on_court
                timeouts:
                  value:
                    message: Ekipa je iskoristila sve timeoute.
                    code: timeout_limit_reached
                id_conflict:
                  value:
                    message: Događaj s ovim ID-jem već postoji s drugačijim podacima.
                    code: event_id_conflict
        '422':
          description: Validacija (nedostaju ili su suvišna polja za tip)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Podaci nisu ispravni.
                code: validation_error
                errors:
                  minute:
                    - Minuta je obavezna za timeout i mora biti između 1 i 10.

  /matches/{match}/events/{event}/undo:
    parameters:
      - $ref: '#/components/parameters/MatchId'
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [Match events]
      operationId: undoMatchEvent
      summary: Poništavanje događaja
      description: |
        Događaj se ne briše, nego dobiva `is_undone: true`. Može se poništiti zadnji
        ili bilo koji raniji događaj. Ponovno poništavanje već poništenog događaja
        vraća `200` bez promjene (idempotentno).

        Moguće dok je utakmica `in_progress` ili `finished`; nakon predaje
        (`submitted`) vraća `409 match_submitted`. **(pretpostavka: poništavanje je
        dopušteno i u statusu `finished`)**

        Ako bi poništavanje dovelo do nedosljednog stanja (npr. poništavanje zamjene
        nakon koje je igrač koji je ušao zabilježio koš), vraća se
        `409 undo_not_allowed`. **(pretpostavka)**

        **Uloga:** scorer (samo dodijeljene)
      x-roles: [scorer]
      responses:
        '200':
          description: Događaj poništen; vraća se ažurirano stanje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCreatedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Poništavanje nije dopušteno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                submitted:
                  value:
                    message: Zapisnik je predan i ne može se mijenjati.
                    code: match_submitted
                locked:
                  value:
                    message: Utakmicu vodi drugi uređaj.
                    code: match_locked

  /matches/{match}/state:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    get:
      tags: [Match events]
      operationId: getMatchState
      summary: Izvedeno stanje utakmice
      description: |
        Sve vrijednosti izračunate su iz neponištenih događaja: rezultat, rezultat po
        četvrtinama, running score, faulovi igrača i trenera, ekipni faulovi u
        trenutnoj četvrtini, bonus, timeouti, igrači na terenu i trenutna četvrtina.

        **Uloga:** scorer (samo dodijeljene), admin
      x-roles: [scorer, admin]
      responses:
        '200':
          description: Stanje utakmice
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MatchState'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------- Match closing
  /matches/{match}/finish:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    post:
      tags: [Match closing]
      operationId: finishMatch
      summary: Završetak utakmice
      description: |
        - Moguće nakon `quarter_end` zadnje četvrtine ili produžetka, kad rezultat nije
          izjednačen (`409 match_cannot_finish`).
        - Zapisničar potvrđuje ili ispravlja vrijeme završetka (`ended_at`); ako se ne
          pošalje, uzima se trenutno vrijeme servera.
        - Status postaje `finished`; novi događaji više nisu mogući.

        **Uloga:** scorer (samo dodijeljene)
      x-roles: [scorer]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishInput'
      responses:
        '200':
          $ref: '#/components/responses/MatchResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Utakmica se još ne može završiti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                quarter_open:
                  value:
                    message: Zadnja četvrtina nije završena.
                    code: match_cannot_finish
                tied:
                  value:
                    message: Rezultat je izjednačen, igra se produžetak.
                    code: match_cannot_finish
                locked:
                  value:
                    message: Utakmicu vodi drugi uređaj.
                    code: match_locked
        '422':
          $ref: '#/components/responses/ValidationError'

  /matches/{match}/submit:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    post:
      tags: [Match closing]
      operationId: submitMatch
      summary: Predaja zapisnika
      description: |
        - Utakmica mora biti `finished` (`409 match_not_finished`).
        - Provjeravaju se obavezni podaci (sastavi, rezultat, završetak).
        - Uz predaju se bilježi protest (`protest`, `protest_note`).
        - Status postaje `submitted`. Server generira i pohranjuje PDF, koji se
          nakon toga ne mijenja.
        - Nakon predaje zapisnik se ne može mijenjati
          **(smije li se ispravljati nakon predaje, potvrditi sa savezom)**.

        **Uloga:** scorer (samo dodijeljene)
      x-roles: [scorer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitInput'
            example:
              protest: true
              protest_note: Gostujuća ekipa ulaže protest zbog neispravnog sata za napad.
      responses:
        '200':
          $ref: '#/components/responses/MatchResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Utakmica nije završena ili je već predana
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_finished:
                  value:
                    message: Utakmica nije završena.
                    code: match_not_finished
                submitted:
                  value:
                    message: Zapisnik je već predan.
                    code: match_submitted
        '422':
          $ref: '#/components/responses/ValidationError'

  /matches/{match}/report.pdf:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    get:
      tags: [Match closing]
      operationId: getMatchReportPdf
      summary: PDF zapisnik (službeni obrazac)
      description: |
        PDF prema službenom obrascu (HKS). Ne sadrži poništene događaje.
        - `submitted`: vraća se pohranjeni PDF.
        - `finished`: PDF se generira na zahtjev kao pregled prije predaje.
          **(pretpostavka)**
        - Ostali statusi: `409 report_not_available`.

        **Uloga:** admin, scorer (samo dodijeljene)
      x-roles: [admin, scorer]
      responses:
        '200':
          description: PDF datoteka
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="zapisnik-1-U15-2026-11-14.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Zapisnik još nije dostupan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Zapisnik je dostupan tek nakon završetka utakmice.
                code: report_not_available

# ====================================================================== COMPONENTS
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Laravel Sanctum token iz `POST /auth/login`

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Search:
      name: search
      in: query
      description: Pretraga po nazivu / imenu
      schema:
        type: string
    CategoryFilter:
      name: category_id
      in: query
      schema:
        type: integer
    SeasonFilter:
      name: season_id
      in: query
      schema:
        type: integer
    LeagueFilter:
      name: league_id
      in: query
      schema:
        type: integer
    ClubFilter:
      name: club_id
      in: query
      schema:
        type: integer
    UserId:
      name: user
      in: path
      required: true
      schema:
        type: integer
    SeasonId:
      name: season
      in: path
      required: true
      schema:
        type: integer
    CategoryId:
      name: category
      in: path
      required: true
      schema:
        type: integer
    LeagueId:
      name: league
      in: path
      required: true
      schema:
        type: integer
    LeagueEditionId:
      name: league_edition
      in: path
      required: true
      schema:
        type: integer
    ClubId:
      name: club
      in: path
      required: true
      schema:
        type: integer
    ClubTeamId:
      name: club_team
      in: path
      required: true
      schema:
        type: integer
    PlayerId:
      name: player
      in: path
      required: true
      schema:
        type: integer
    CoachId:
      name: coach
      in: path
      required: true
      schema:
        type: integer
    RefereeId:
      name: referee
      in: path
      required: true
      schema:
        type: integer
    VenueId:
      name: venue
      in: path
      required: true
      schema:
        type: integer
    MatchId:
      name: match
      in: path
      required: true
      schema:
        type: integer
    EventId:
      name: event
      in: path
      required: true
      description: UUID događaja
      schema:
        type: string
        format: uuid
    TeamPath:
      name: team
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TeamSide'
    TeamQuery:
      name: team
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/TeamSide'

  responses:
    Unauthenticated:
      description: Nije prijavljen ili je token neispravan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Niste prijavljeni.
            code: unauthenticated
    Forbidden:
      description: Uloga nema ovlasti (ili zapisničar nije dodijeljen utakmici)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Nemate ovlasti za ovu radnju.
            code: forbidden
    NotFound:
      description: Resurs ne postoji (ili pripada drugom savezu)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Traženi zapis ne postoji.
            code: not_found
    ResourceInUse:
      description: Zapis je u upotrebi i ne može se obrisati
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Zapis se koristi i ne može se obrisati.
            code: resource_in_use
    MatchAlreadyStarted:
      description: Utakmica je već započela
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Utakmica je već započela, sastav se ne može mijenjati.
            code: match_already_started
    ValidationError:
      description: Validacija nije prošla
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Podaci nisu ispravni.
            code: validation_error
            errors:
              name:
                - Naziv je obavezan.
    SeasonResponse:
      description: Sezona
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/Season'
    CategoryResponse:
      description: Kategorija
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/Category'
    LeagueResponse:
      description: Liga
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/League'
    LeagueEditionResponse:
      description: Izdanje lige
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/LeagueEdition'
    ClubResponse:
      description: Klub
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/Club'
    ClubTeamResponse:
      description: Selekcija
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/ClubTeam'
    PlayerResponse:
      description: Igrač
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/Player'
    CoachResponse:
      description: Trener
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/Coach'
    RefereeResponse:
      description: Sudac
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/Referee'
    VenueResponse:
      description: Dvorana
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/Venue'
    MatchResponse:
      description: Utakmica
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/Match'

  schemas:
    # ------------------------------------------------ common
    Error:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
          description: Poruka na hrvatskom, prikladna za prikaz korisniku
          example: Podaci nisu ispravni.
        code:
          type: string
          description: Strojno čitljiv kod greške
          example: validation_error
        errors:
          type: object
          description: Samo kod validacije (`422`); ključ je naziv polja
          additionalProperties:
            type: array
            items:
              type: string
          example:
            name:
              - Naziv je obavezan.
    PaginationMeta:
      type: object
      required: [page, per_page, total, last_page]
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 25
        total:
          type: integer
          example: 42
        last_page:
          type: integer
          example: 2
    IdName:
      type: object
      description: Skraćeni prikaz povezanog zapisa
      required: [id, name]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: U15
    TeamSide:
      type: string
      description: Ekipa A (domaćin) ili ekipa B (gost)
      enum: [home, away]
    Role:
      type: string
      enum: [admin, scorer, super_admin]

    # ------------------------------------------------ auth / users
    LoginRequest:
      type: object
      required: [username, password, device_name, client]
      properties:
        username:
          type: string
          example: ivan.zapisnicar
        password:
          type: string
          format: password
          example: tajna-lozinka
        device_name:
          type: string
          description: Naziv uređaja, sprema se uz token
          example: Samsung Tab A8
        client:
          type: string
          enum: [web, tablet]
          description: Klijent s kojeg se korisnik prijavljuje **(pretpostavka)**
    LoginResponse:
      type: object
      required: [token, token_type, user]
      properties:
        token:
          type: string
          example: 3|Xk9vY2hAbC1kZWYtZ2hp...
        token_type:
          type: string
          example: Bearer
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Istek tokena (null ako ne ističe) **(trajanje sesije potvrditi)**
          example: '2026-11-06T08:00:00Z'
        user:
          $ref: '#/components/schemas/AuthUser'
    AuthUser:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: integer
          example: 12
        username:
          type: string
          example: ivan.zapisnicar
        role:
          $ref: '#/components/schemas/Role'
        federation:
          type: object
          allOf:
            - $ref: '#/components/schemas/IdName'
          nullable: true
          description: Savez korisnika (null za super_admin)
          example:
            id: 1
            name: Košarkaški savez Varaždinske županije
    User:
      type: object
      required: [id, username, role, is_active, created_at]
      properties:
        id:
          type: integer
          example: 12
        username:
          type: string
          example: ivan.zapisnicar
        role:
          type: string
          enum: [scorer]
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: '2026-10-01T10:00:00Z'
    UserCreated:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [initial_password]
          properties:
            initial_password:
              type: string
              description: Početna lozinka; vraća se samo pri kreiranju
              example: Plava-Lopta-42
    UserCreateInput:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          example: ivan.zapisnicar
        password:
          type: string
          format: password
          minLength: 8
          description: Ako se izostavi, sustav generira lozinku
          example: Plava-Lopta-42
    UserUpdateInput:
      type: object
      required: [is_active]
      properties:
        is_active:
          type: boolean
          example: false
    UserList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ------------------------------------------------ seasons
    Season:
      type: object
      required: [id, name, start_year, end_year]
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: 2026./2027.
        start_year:
          type: integer
          example: 2026
        end_year:
          type: integer
          example: 2027
    SeasonInput:
      type: object
      required: [name, start_year, end_year]
      properties:
        name:
          type: string
          maxLength: 50
          example: 2026./2027.
        start_year:
          type: integer
          example: 2026
        end_year:
          type: integer
          description: Ne smije biti manji od `start_year`
          example: 2027
    SeasonList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Season'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ------------------------------------------------ categories
    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: U15
        max_age:
          type: integer
          nullable: true
          description: Najveća dob (null za seniore)
          example: 15
    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 50
          example: U15
        max_age:
          type: integer
          nullable: true
          minimum: 1
          example: 15
    CategoryList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ------------------------------------------------ leagues
    League:
      type: object
      required: [id, name, category]
      properties:
        id:
          type: integer
          example: 2
        name:
          type: string
          example: 1. županijska liga U15
        category:
          $ref: '#/components/schemas/IdName'
    LeagueInput:
      type: object
      required: [name, category_id]
      properties:
        name:
          type: string
          maxLength: 100
          example: 1. županijska liga U15
        category_id:
          type: integer
          example: 3
    LeagueList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/League'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ------------------------------------------------ league editions
    LeagueEdition:
      type: object
      required: [id, league, season, category]
      properties:
        id:
          type: integer
          example: 7
        league:
          $ref: '#/components/schemas/IdName'
        season:
          $ref: '#/components/schemas/IdName'
        category:
          $ref: '#/components/schemas/IdName'
        teams_count:
          type: integer
          example: 8
    LeagueEditionInput:
      type: object
      required: [league_id, season_id]
      properties:
        league_id:
          type: integer
          example: 2
        season_id:
          type: integer
          example: 3
    LeagueEditionTeamInput:
      type: object
      required: [club_team_id]
      properties:
        club_team_id:
          type: integer
          example: 15
    LeagueEditionList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LeagueEdition'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ------------------------------------------------ clubs
    Club:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          example: 4
        name:
          type: string
          example: KK Varaždin
    ClubInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          example: KK Varaždin
    ClubList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Club'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ------------------------------------------------ club teams
    ClubTeam:
      type: object
      required: [id, name, club, category]
      properties:
        id:
          type: integer
          example: 15
        name:
          type: string
          example: KK Varaždin U15
        club:
          $ref: '#/components/schemas/IdName'
        category:
          $ref: '#/components/schemas/IdName'
    ClubTeamInput:
      type: object
      required: [name, club_id, category_id]
      properties:
        name:
          type: string
          maxLength: 100
          example: KK Varaždin U15
        club_id:
          type: integer
          example: 4
        category_id:
          type: integer
          example: 3
    ClubTeamList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ClubTeam'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    RosterEntryInput:
      type: object
      required: [player_id]
      properties:
        player_id:
          type: integer
          example: 101

    # ------------------------------------------------ players
    Player:
      type: object
      required: [id, first_name, last_name, date_of_birth, license_number, club]
      properties:
        id:
          type: integer
          example: 101
        first_name:
          type: string
          example: Luka
        last_name:
          type: string
          example: Babić
        date_of_birth:
          type: string
          format: date
          example: '2012-04-18'
        license_number:
          type: string
          example: HKS-2012-04411
        club:
          $ref: '#/components/schemas/IdName'
    PlayerInput:
      type: object
      required: [first_name, last_name, date_of_birth, license_number, club_id]
      properties:
        first_name:
          type: string
          maxLength: 100
          example: Luka
        last_name:
          type: string
          maxLength: 100
          example: Babić
        date_of_birth:
          type: string
          format: date
          description: Ne smije biti u budućnosti
          example: '2012-04-18'
        license_number:
          type: string
          maxLength: 50
          example: HKS-2012-04411
        club_id:
          type: integer
          example: 4
    PlayerList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Player'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ------------------------------------------------ coaches
    Coach:
      type: object
      required: [id, first_name, last_name, license_number, club]
      properties:
        id:
          type: integer
          example: 7
        first_name:
          type: string
          example: Ivan
        last_name:
          type: string
          example: Kovačić
        license_number:
          type: string
          example: HKS-T-0193
        club:
          $ref: '#/components/schemas/IdName'
    CoachInput:
      type: object
      required: [first_name, last_name, license_number, club_id]
      properties:
        first_name:
          type: string
          maxLength: 100
          example: Ivan
        last_name:
          type: string
          maxLength: 100
          example: Kovačić
        license_number:
          type: string
          maxLength: 50
          example: HKS-T-0193
        club_id:
          type: integer
          example: 4
    CoachList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Coach'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ------------------------------------------------ referees
    Referee:
      type: object
      required: [id, first_name, last_name]
      properties:
        id:
          type: integer
          example: 5
        first_name:
          type: string
          example: Tomislav
        last_name:
          type: string
          example: Jurić
    RefereeInput:
      type: object
      required: [first_name, last_name]
      properties:
        first_name:
          type: string
          maxLength: 100
          example: Tomislav
        last_name:
          type: string
          maxLength: 100
          example: Jurić
    RefereeList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Referee'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ------------------------------------------------ venues
    Venue:
      type: object
      required: [id, name, city]
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: Gradska sportska dvorana
        city:
          type: string
          example: Varaždin
    VenueInput:
      type: object
      required: [name, city]
      properties:
        name:
          type: string
          maxLength: 100
          example: Gradska sportska dvorana
        city:
          type: string
          maxLength: 100
          example: Varaždin
    VenueList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Venue'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ------------------------------------------------ matches
    MatchStatus:
      type: string
      description: |
        `scheduled` = Zakazana, `in_progress` = U tijeku, `finished` = Završena,
        `submitted` = Predana
      enum: [scheduled, in_progress, finished, submitted]
    Score:
      type: object
      required: [home, away]
      properties:
        home:
          type: integer
          example: 68
        away:
          type: integer
          example: 61
    MatchSummary:
      type: object
      required: [id, match_number, league_edition, home_team, away_team, scheduled_at, status]
      properties:
        id:
          type: integer
          example: 42
        match_number:
          type: integer
          example: 1
        round:
          type: integer
          nullable: true
          example: 3
        league_edition:
          $ref: '#/components/schemas/LeagueEdition'
        home_team:
          $ref: '#/components/schemas/ClubTeam'
        away_team:
          $ref: '#/components/schemas/ClubTeam'
        scheduled_at:
          type: string
          format: date-time
          example: '2026-11-14T17:00:00Z'
        venue:
          type: object
          allOf:
            - $ref: '#/components/schemas/Venue'
          nullable: true
        scorer:
          type: object
          nullable: true
          required: [id, username]
          properties:
            id:
              type: integer
              example: 12
            username:
              type: string
              example: ivan.zapisnicar
        status:
          $ref: '#/components/schemas/MatchStatus'
        score:
          type: object
          allOf:
            - $ref: '#/components/schemas/Score'
          nullable: true
          description: Rezultat izveden iz događaja (null dok utakmica nije započela)
    Match:
      allOf:
        - $ref: '#/components/schemas/MatchSummary'
        - type: object
          properties:
            crew_chief:
              type: object
              allOf:
                - $ref: '#/components/schemas/Referee'
              nullable: true
              description: Glavni sudac (Crew chief)
            umpire_1:
              type: object
              allOf:
                - $ref: '#/components/schemas/Referee'
              nullable: true
            umpire_2:
              type: object
              allOf:
                - $ref: '#/components/schemas/Referee'
              nullable: true
            assistant_scorer:
              type: string
              nullable: true
              description: Pomoćni zapisničar (slobodan tekst)
              example: Marko Horvat
            timer:
              type: string
              nullable: true
              description: Mjeritelj vremena (slobodan tekst)
              example: Ana Kovač
            shot_clock_operator:
              type: string
              nullable: true
              description: Operater 24 s (slobodan tekst)
              example: Petra Novak
            started_at:
              type: string
              format: date-time
              nullable: true
              example: '2026-11-14T17:02:00Z'
            ended_at:
              type: string
              format: date-time
              nullable: true
              example: '2026-11-14T18:31:00Z'
            protest:
              type: boolean
              example: false
            protest_note:
              type: string
              nullable: true
              example: null
    MatchCreateInput:
      type: object
      required: [league_edition_id, match_number, home_team_id, away_team_id, scheduled_at]
      properties:
        league_edition_id:
          type: integer
          example: 7
        match_number:
          type: integer
          minimum: 1
          example: 1
        round:
          type: integer
          nullable: true
          minimum: 1
          example: 3
        home_team_id:
          type: integer
          description: ID selekcije domaćina (club team)
          example: 15
        away_team_id:
          type: integer
          example: 18
        scheduled_at:
          type: string
          format: date-time
          example: '2026-11-14T17:00:00Z'
        venue_id:
          type: integer
          nullable: true
          example: 3
        crew_chief_id:
          type: integer
          nullable: true
          example: 5
        umpire_1_id:
          type: integer
          nullable: true
          example: 8
        umpire_2_id:
          type: integer
          nullable: true
          example: 9
        scorer_id:
          type: integer
          nullable: true
          description: Račun s ulogom `scorer`
          example: 12
        assistant_scorer:
          type: string
          nullable: true
          example: Marko Horvat
        timer:
          type: string
          nullable: true
          example: Ana Kovač
        shot_clock_operator:
          type: string
          nullable: true
          example: Petra Novak
    MatchUpdateInput:
      type: object
      description: Sva polja su opcionalna; šalju se samo ona koja se mijenjaju.
      properties:
        league_edition_id:
          type: integer
        match_number:
          type: integer
          minimum: 1
        round:
          type: integer
          nullable: true
        home_team_id:
          type: integer
        away_team_id:
          type: integer
        scheduled_at:
          type: string
          format: date-time
        venue_id:
          type: integer
          nullable: true
        crew_chief_id:
          type: integer
          nullable: true
        umpire_1_id:
          type: integer
          nullable: true
        umpire_2_id:
          type: integer
          nullable: true
        scorer_id:
          type: integer
          nullable: true
        assistant_scorer:
          type: string
          nullable: true
        timer:
          type: string
          nullable: true
        shot_clock_operator:
          type: string
          nullable: true
    MatchList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MatchSummary'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ------------------------------------------------ lineups & coaches
    LineupPlayerInput:
      type: object
      required: [player_id, jersey_number]
      properties:
        player_id:
          type: integer
          example: 101
        jersey_number:
          type: integer
          minimum: 0
          maximum: 99
          example: 7
        is_captain:
          type: boolean
          default: false
        is_starter:
          type: boolean
          default: false
          description: U prvoj petorci
    LineupInput:
      type: object
      required: [players]
      properties:
        players:
          type: array
          minItems: 5
          maxItems: 12
          items:
            $ref: '#/components/schemas/LineupPlayerInput'
      example:
        players:
          - { player_id: 101, jersey_number: 4, is_captain: true, is_starter: true }
          - { player_id: 102, jersey_number: 5, is_captain: false, is_starter: true }
          - { player_id: 103, jersey_number: 7, is_captain: false, is_starter: true }
          - { player_id: 104, jersey_number: 9, is_captain: false, is_starter: true }
          - { player_id: 105, jersey_number: 11, is_captain: false, is_starter: true }
          - { player_id: 106, jersey_number: 12, is_captain: false, is_starter: false }
          - { player_id: 107, jersey_number: 14, is_captain: false, is_starter: false }
    LineupPlayer:
      type: object
      required: [player_id, first_name, last_name, license_number, jersey_number, is_captain, is_starter]
      properties:
        player_id:
          type: integer
          example: 101
        first_name:
          type: string
          example: Luka
        last_name:
          type: string
          example: Babić
        license_number:
          type: string
          example: HKS-2012-04411
        jersey_number:
          type: integer
          example: 4
        is_captain:
          type: boolean
          example: true
        is_starter:
          type: boolean
          example: true
    Lineup:
      type: object
      required: [team, club_team, players]
      properties:
        team:
          $ref: '#/components/schemas/TeamSide'
        club_team:
          $ref: '#/components/schemas/IdName'
        players:
          type: array
          description: Prazno ako sastav još nije prijavljen
          items:
            $ref: '#/components/schemas/LineupPlayer'
    MatchCoachesInput:
      type: object
      required: [head_coach_id]
      properties:
        head_coach_id:
          type: integer
          example: 7
        assistant_coach_id:
          type: integer
          nullable: true
          example: 9
    MatchCoaches:
      type: object
      required: [team]
      properties:
        team:
          $ref: '#/components/schemas/TeamSide'
        head_coach:
          type: object
          allOf:
            - $ref: '#/components/schemas/Coach'
          nullable: true
        assistant_coach:
          type: object
          allOf:
            - $ref: '#/components/schemas/Coach'
          nullable: true

    # ------------------------------------------------ events
    EventType:
      type: string
      description: |
        | API | Baza (`vrsta_aktivnosti`) | Značenje |
        |---|---|---|
        | `score_1` | Kos_1 | Koš 1 bod |
        | `score_2` | Kos_2 | Koš 2 boda |
        | `score_3` | Kos_3 | Koš 3 boda |
        | `foul_personal` | Osobna_P | Osobni faul (P) |
        | `foul_technical` | Tehnicka_T | Tehnički faul igrača (T) |
        | `foul_unsportsmanlike` | Nesportska_U | Nesportski faul (U) |
        | `foul_disqualifying` | Diskvalifikacijska_D | Diskvalificirajući faul (D), igrač ili trener |
        | `foul_coach_technical` | Tehnicka_C | Tehnički faul trenera (C) |
        | `foul_bench_technical` | Tehnicka_B | Tehnički faul klupe (B), upisuje se treneru |
        | `substitution` | Zamjena | Zamjena |
        | `timeout` | Timeout | Timeout |
        | `hcc` | HCC | Izazov trenera |
        | `quarter_end` | Zavrsi_cetvrtinu | Kraj četvrtine / produžetka |
      enum:
        - score_1
        - score_2
        - score_3
        - foul_personal
        - foul_technical
        - foul_unsportsmanlike
        - foul_disqualifying
        - foul_coach_technical
        - foul_bench_technical
        - substitution
        - timeout
        - hcc
        - quarter_end
    EventInput:
      type: object
      required: [id, type, quarter]
      properties:
        id:
          type: string
          format: uuid
          description: UUID v4 koji generira klijent (idempotentnost)
          example: 3f1c2a8e-7b4d-4e0a-9c55-0b6f1d2e3a41
        type:
          $ref: '#/components/schemas/EventType'
        team:
          type: string
          allOf:
            - $ref: '#/components/schemas/TeamSide'
          nullable: true
          description: Obavezno za sve tipove osim `quarter_end`
        player_id:
          type: integer
          nullable: true
          description: Igrač (kod zamjene igrač koji ulazi)
          example: 101
        player_out_id:
          type: integer
          nullable: true
          description: Samo kod zamjene, igrač koji izlazi
        coach_id:
          type: integer
          nullable: true
          description: Trener (faulovi C, B i D trenera)
        quarter:
          type: integer
          minimum: 1
          description: 1-4, 5 i više su produžeci
          example: 1
        minute:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10
          description: Samo kod `timeout` (obavezno) i `hcc` (opcionalno)
    Event:
      type: object
      required: [id, sequence, type, quarter, is_undone, created_at]
      properties:
        id:
          type: string
          format: uuid
          example: 3f1c2a8e-7b4d-4e0a-9c55-0b6f1d2e3a41
        sequence:
          type: integer
          description: Redni broj unutar utakmice (dodjeljuje server)
          example: 17
        type:
          $ref: '#/components/schemas/EventType'
        team:
          type: string
          allOf:
            - $ref: '#/components/schemas/TeamSide'
          nullable: true
        player_id:
          type: integer
          nullable: true
          example: 101
        player_out_id:
          type: integer
          nullable: true
          example: null
        coach_id:
          type: integer
          nullable: true
          example: null
        quarter:
          type: integer
          example: 1
        minute:
          type: integer
          nullable: true
          example: null
        is_undone:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
          example: '2026-11-14T17:06:12Z'
    EventCreatedResponse:
      type: object
      description: Događaj i novo izvedeno stanje, da tablet ne mora posebno dohvaćati stanje
      required: [data, state]
      properties:
        data:
          $ref: '#/components/schemas/Event'
        state:
          $ref: '#/components/schemas/MatchState'

    # ------------------------------------------------ derived state
    FoulEntry:
      type: object
      required: [event_id, type, quarter]
      properties:
        event_id:
          type: string
          format: uuid
        type:
          type: string
          description: Oznaka na zapisniku
          enum: [P, T, U, D, C, B]
          example: P
        quarter:
          type: integer
          example: 2
    PlayerState:
      type: object
      required: [player_id, jersey_number, first_name, last_name, points, fouls, foul_count, on_court, is_disqualified]
      properties:
        player_id:
          type: integer
          example: 101
        jersey_number:
          type: integer
          example: 4
        first_name:
          type: string
          example: Luka
        last_name:
          type: string
          example: Babić
        is_captain:
          type: boolean
          example: true
        points:
          type: integer
          example: 14
        fouls:
          type: array
          items:
            $ref: '#/components/schemas/FoulEntry'
        foul_count:
          type: integer
          example: 2
        on_court:
          type: boolean
          example: true
        is_disqualified:
          type: boolean
          description: Isključen (5 faulova ili D)
          example: false
    CoachState:
      type: object
      required: [coach_id, role, fouls, is_disqualified]
      properties:
        coach_id:
          type: integer
          example: 7
        first_name:
          type: string
          example: Ivan
        last_name:
          type: string
          example: Kovačić
        role:
          type: string
          enum: [head, assistant]
        fouls:
          type: array
          items:
            $ref: '#/components/schemas/FoulEntry'
        is_disqualified:
          type: boolean
          example: false
    TimeoutEntry:
      type: object
      required: [event_id, number, quarter, minute]
      properties:
        event_id:
          type: string
          format: uuid
        number:
          type: integer
          description: Redni broj timeouta ekipe
          example: 1
        quarter:
          type: integer
          example: 2
        minute:
          type: integer
          example: 7
    TeamState:
      type: object
      required: [club_team, score, team_fouls_current_quarter, in_bonus, timeouts, timeouts_remaining, players, coaches]
      properties:
        club_team:
          $ref: '#/components/schemas/IdName'
        score:
          type: integer
          example: 34
        team_fouls_current_quarter:
          type: integer
          example: 3
        in_bonus:
          type: boolean
          description: Ekipa je u bonusu **(pravilo potvrditi)**
          example: false
        timeouts:
          type: array
          items:
            $ref: '#/components/schemas/TimeoutEntry'
        timeouts_remaining:
          type: integer
          description: Preostali timeouti u trenutnom razdoblju **(pravilo potvrditi)**
          example: 1
        hcc:
          type: array
          description: Izazovi trenera (event_id, četvrtina, minuta)
          items:
            type: object
            properties:
              event_id:
                type: string
                format: uuid
              quarter:
                type: integer
              minute:
                type: integer
                nullable: true
        players:
          type: array
          items:
            $ref: '#/components/schemas/PlayerState'
        coaches:
          type: array
          items:
            $ref: '#/components/schemas/CoachState'
    RunningScoreEntry:
      type: object
      required: [event_id, sequence, team, points, home_score, away_score, quarter]
      properties:
        event_id:
          type: string
          format: uuid
        sequence:
          type: integer
          example: 17
        team:
          $ref: '#/components/schemas/TeamSide'
        player_id:
          type: integer
          example: 101
        jersey_number:
          type: integer
          example: 4
        points:
          type: integer
          enum: [1, 2, 3]
          example: 2
        home_score:
          type: integer
          description: Kumulativni rezultat domaćina nakon ovog koša
          example: 12
        away_score:
          type: integer
          example: 9
        quarter:
          type: integer
          example: 1
    QuarterScore:
      type: object
      required: [quarter, home, away]
      properties:
        quarter:
          type: integer
          description: 1-4, 5 i više su produžeci
          example: 1
        home:
          type: integer
          example: 18
        away:
          type: integer
          example: 15
    MatchState:
      type: object
      required: [match_id, status, current_quarter, is_overtime, quarter_open, score, score_by_quarter, home, away, running_score, last_sequence]
      properties:
        match_id:
          type: integer
          example: 42
        status:
          $ref: '#/components/schemas/MatchStatus'
        current_quarter:
          type: integer
          example: 2
        is_overtime:
          type: boolean
          example: false
        quarter_open:
          type: boolean
          description: false nakon `quarter_end`, dok sljedeća četvrtina ne počne
          example: true
        can_finish:
          type: boolean
          description: Utakmica se može završiti (zadnja četvrtina završena, rezultat nije izjednačen)
          example: false
        score:
          $ref: '#/components/schemas/Score'
        score_by_quarter:
          type: array
          items:
            $ref: '#/components/schemas/QuarterScore'
        winner:
          type: string
          allOf:
            - $ref: '#/components/schemas/TeamSide'
          nullable: true
          description: Postavljeno kad je utakmica završena
        home:
          $ref: '#/components/schemas/TeamState'
        away:
          $ref: '#/components/schemas/TeamState'
        running_score:
          type: array
          description: Kronološki tijek koševa (bez poništenih)
          items:
            $ref: '#/components/schemas/RunningScoreEntry'
        last_sequence:
          type: integer
          description: Redni broj zadnjeg zapisanog događaja
          example: 58

    # ------------------------------------------------ closing
    FinishInput:
      type: object
      properties:
        ended_at:
          type: string
          format: date-time
          description: Vrijeme završetka; zadano trenutno vrijeme servera
          example: '2026-11-14T18:31:00Z'
    SubmitInput:
      type: object
      required: [protest]
      properties:
        protest:
          type: boolean
          example: false
        protest_note:
          type: string
          nullable: true
          maxLength: 1000
          description: Obavezno ako je `protest` true
    Scoresheet:
      type: object
      required: [match, lineups, coaches, state]
      properties:
        match:
          $ref: '#/components/schemas/Match'
        lineups:
          type: object
          required: [home, away]
          properties:
            home:
              $ref: '#/components/schemas/Lineup'
            away:
              $ref: '#/components/schemas/Lineup'
        coaches:
          type: object
          required: [home, away]
          properties:
            home:
              $ref: '#/components/schemas/MatchCoaches'
            away:
              $ref: '#/components/schemas/MatchCoaches'
        state:
          $ref: '#/components/schemas/MatchState'
