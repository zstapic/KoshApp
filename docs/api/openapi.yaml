    get:
      tags: [Matches]
      operationId: getMatch
      summary: Podaci o utakmici (zaglavlje)
      description: |
        Zaglavlje utakmice: ekipe, natjecanje, kolo i broj, termin, dvorana, suci,
        zapisničar i ostalo osoblje. Zapisničar vidi samo svoje utakmice.

        **Uloga:** admin, scorer (samo dodijeljene)
      x-roles: [admin, scorer]
      responses:
        '200':
          $ref: '#/components/responses/MatchResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Matches]
      operationId: updateMatch
      summary: Izmjena utakmice i dodjela osoblja
      description: |
        Šalju se samo polja koja se mijenjaju.

        - Dok je status `scheduled` mogu se mijenjati sva polja.
        - Nakon početka (`in_progress` i kasnije) zaključani su `league_edition_id`,
          `match_number`, `round`, `home_team_id`, `away_team_id`, `scheduled_at`
          i `scorer_id` (`409 match_locked_fields`).
        - Dvorana, suci i volonteri mogu se mijenjati dok utakmica nije predana.
          **(pretpostavka)**
        - Predana utakmica (`submitted`) ne može se mijenjati.

        **Uloga:** admin
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchUpdateInput'
            example:
              venue_id: 3
              crew_chief_id: 5
              umpire_1_id: 8
              umpire_2_id: 9
              scorer_id: 12
              assistant_scorer: Marko Horvat
              timer: Ana Kovač
              shot_clock_operator: Petra Novak
      responses:
        '200':
          $ref: '#/components/responses/MatchResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Polje je zaključano u trenutnom statusu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Nakon početka utakmice ekipe i termin se ne mogu mijenjati.
                code: match_locked_fields
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Matches]
      operationId: deleteMatch
      summary: Brisanje utakmice
      description: |
