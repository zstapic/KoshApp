openapi: 3.0.3
info:
  title: KoshApp API
  version: 0.1.0
  description: |
    API digitalnog košarkaškog zapisnika (KOSH-40).

    Specifikacija opisuje i dijelove koji još nisu implementirani (EP-2 do EP-8).
    Pravila dizajna su u `docs/api-dogovori.md`.

    ## Prijava i uloge
    - Prijava tokenom (Laravel Sanctum): `POST /api/auth/login` vraća token,
      koji se šalje u zaglavlju `Authorization: Bearer <token>`.
    - Uloge: `admin` (admin saveza, samo web), `scorer` (zapisničar, samo tablet),
      `super_admin` (vlasnik platforme). Uloga koja smije pozvati endpoint navedena je
      u opisu svakog endpointa i u proširenju `x-roles`.
    - **Savez (tenant) se uvijek određuje iz tokena.** Nikad se ne šalje kao parametar.
      Resurs drugog saveza ponaša se kao da ne postoji (`404`).

    ## Konvencije
    - JSON, imena polja `snake_case` na engleskom.
    - Datumi i vremena u ISO 8601, UTC (npr. `2026-11-14T17:00:00Z`). Prikaz u zoni
      Europe/Zagreb radi klijent.
    - Identifikatori resursa su cijeli brojevi. Događaji utakmice imaju **UUID v4**
      koji generira klijent.
    - Pojedinačni resurs vraća se kao `{ "data": { ... } }`.
    - Popisi: `?page=1&per_page=25` (zadano 25, najviše 100), odgovor
      `{ "data": [...], "meta": { "page", "per_page", "total", "last_page" } }`.
    - Greške: `{ "message", "code", "errors" }` (`errors` samo kod validacije, `422`).

    ## Brisanje
    Brisanje šifranika blokirano je ako je zapis u upotrebi. Tada se vraća `409`
    s kodom `resource_in_use`.

    ## Pretpostavke (potvrditi s timom / savezom)
    Mjesta označena s **(pretpostavka)** nisu definirana u dokumentaciji.
  contact:
    name: KoshApp tim
servers:
  - url: http://localhost:8000/api
    description: Lokalni razvoj (php artisan serve)
  - url: http://10.0.2.2:8000/api
    description: Lokalni razvoj iz Android emulatora

tags:
  - name: System
    description: Provjera rada servera
  - name: Auth
    description: Prijava i odjava (EP-2)
  - name: Users
    description: Računi zapisničara (EP-2, KOSH-46)
  - name: Seasons
    description: Sezone (KOSH-47)
  - name: Categories
    description: Dobne kategorije (KOSH-48)
  - name: Leagues
    description: Lige (KOSH-49)
  - name: League editions
    description: Izdanja lige u sezoni i prijavljene ekipe (KOSH-50, KOSH-51)
  - name: Clubs
    description: Klubovi (KOSH-52)
  - name: Club teams
    description: Selekcije kluba i kadrovi po sezoni (KOSH-53, KOSH-55)
  - name: Players
    description: Igrači (KOSH-54)
  - name: Coaches
    description: Treneri (KOSH-56)
  - name: Referees
    description: Suci (KOSH-57)
  - name: Venues
    description: Dvorane (KOSH-58)
  - name: Matches
    description: Raspored i podaci utakmice (EP-4, KOSH-64, KOSH-65, EP-8)
  - name: Match preparation
    description: Sastavi, treneri i početak utakmice (EP-5)
  - name: Match events
    description: Događaji utakmice i izvedeno stanje (EP-6)
  - name: Match closing
    description: Završetak, predaja i PDF zapisnik (EP-7)

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- System
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Provjera rada servera
      description: |
        Javni endpoint, ne traži prijavu.

        **Uloga:** javno
      x-roles: [public]
      security: []
      responses:
        '200':
          description: Server radi
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
              example:
                status: ok

  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Prijava korisničkim imenom i lozinkom
      description: |
        Vraća Sanctum token. Pravila:
        - Deaktiviran račun ne može se prijaviti.
        - Pogrešno korisničko ime ili lozinka daju opću poruku (`invalid_credentials`),
          ne otkriva se što je pogrešno.
        - `client` određuje odakle se korisnik prijavljuje: `web` dopušta samo
          `admin` (i `super_admin`), `tablet` samo `scorer`. Inače `403`
          s kodom `role_not_allowed_on_client`. **(pretpostavka: polje `client`)**
        - Lozinka se nikad ne vraća.

        **Uloga:** javno
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              tablet:
                summary: Zapisničar na tabletu
                value:
                  username: ivan.zapisnicar
                  password: tajna-lozinka
                  device_name: Samsung Tab A8 (dvorana Varaždin)
                  client: tablet
              web:
                summary: Admin na webu
                value:
                  username: admin.ksvz
                  password: tajna-lozinka
                  device_name: Chrome
                  client: web
      responses:
        '200':
          description: Uspješna prijava
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Pogrešni podaci ili deaktiviran račun
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    message: Pogrešno korisničko ime ili lozinka.
                    code: invalid_credentials
                inactive:
                  value:
                    message: Račun je deaktiviran.
                    code: account_inactive
        '403':
          description: Uloga ne smije koristiti ovog klijenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Zapisničar se ne može prijaviti na web aplikaciju.
                code: role_not_allowed_on_client
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Odjava (poništava trenutni token)
      description: |
        **Uloga:** admin, scorer, super_admin
      x-roles: [admin, scorer, super_admin]
      responses:
        '204':
          description: Odjavljen
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Podaci o prijavljenom korisniku
      description: |
        **Uloga:** admin, scorer, super_admin
      x-roles: [admin, scorer, super_admin]
      responses:
        '200':
          description: Prijavljeni korisnik
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  # ---------------------------------------------------------------- Users
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Popis zapisničara saveza
      description: |
        **Uloga:** admin
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Popis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      operationId: createUser
      summary: Kreiranje računa zapisničara
      description: |
        - Uloga je fiksno `scorer`, savez se postavlja prema adminu.
        - Korisničko ime je jedinstveno unutar saveza.
        - Ako se `password` ne pošalje, sustav generira lozinku.
        - Početna lozinka vraća se **samo u ovom odgovoru** (`initial_password`).
        - Lozinka se sprema samo kao hash.

        **Uloga:** admin
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateInput'
      responses:
        '201':
          description: Račun kreiran
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/UserCreated'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{user}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      operationId: getUser
      summary: Jedan zapisničar
      description: |
        **Uloga:** admin
      x-roles: [admin]
      responses:
        '200':
          description: Zapisničar
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Aktivacija ili deaktivacija računa
      description: |
        Deaktiviran račun ne može se prijaviti, a njegovi postojeći tokeni se poništavaju.
        **(pretpostavka: deaktivacija je dovoljna, računi se ne brišu)**

        **Uloga:** admin
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateInput'
      responses:
        '200':
          description: Ažuriran
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ---------------------------------------------------------------- Seasons
  /seasons:
    get:
      tags: [Seasons]
      operationId: listSeasons
      summary: Popis sezona
      description: |
        **Uloga:** admin
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Popis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Seasons]
      operationId: createSeason
      summary: Nova sezona
      description: |
        `end_year` ne smije biti manji od `start_year`.

        **Uloga:** admin
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeasonInput'
      responses:
        '201':
          $ref: '#/components/responses/SeasonResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /seasons/{season}:
    parameters:
      - $ref: '#/components/parameters/SeasonId'
    get:
      tags: [Seasons]
      operationId: getSeason
      summary: Jedna sezona
      description: |
        **Uloga:** admin
      x-roles: [admin]
      responses:
        '200':
          $ref: '#/components/responses/SeasonResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Seasons]
      operationId: updateSeason
      summary: Izmjena sezone
      description: |
        **Uloga:** admin
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeasonInput'
      responses:
        '200':
          $ref: '#/components/responses/SeasonResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Seasons]
      operationId: deleteSeason
      summary: Brisanje sezone
      description: |
        Blokirano ako sezona ima izdanja lige ili kadrove (`409 resource_in_use`).

        **Uloga:** admin
      x-roles: [admin]
      responses:
        '204':
          description: Obrisano
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceInUse'

  # ---------------------------------------------------------------- Categories
  /categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: Popis dobnih kategorija
      description: |
        Početni popis dolazi iz seed podataka.

        **Uloga:** admin
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Popis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Nova kategorija
      description: |
        **Uloga:** admin
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          $ref: '#/components/responses/CategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /categories/{category}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    get:
      tags: [Categories]
      operationId: getCategory
      summary: Jedna kategorija
      description: |
        **Uloga:** admin
      x-roles: [admin]
      responses:
        '200':
          $ref: '#/components/responses/CategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Categories]
      operationId: updateCategory
      summary: Izmjena kategorije
      description: |
        **Uloga:** admin
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          $ref: '#/components/responses/CategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Categories]
      operationId: deleteCategory
      summary: Brisanje kategorije
      description: |
        Blokirano ako kategoriju koriste lige ili selekcije (`409 resource_in_use`).

        **Uloga:** admin
      x-roles: [admin]
      responses:
        '204':
          description: Obrisano
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceInUse'

  # ---------------------------------------------------------------- Leagues
  /leagues:
    get:
      tags: [Leagues]
      operationId: listLeagues
      summary: Popis liga
      description: |
        **Uloga:** admin
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/CategoryFilter'
      responses:
        '200':
          description: Popis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Leagues]
      operationId: createLeague
      summary: Nova liga
      description: |
        Liga ne ovisi o sezoni; u sezoni se otvara kao izdanje lige.

        **Uloga:** admin
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeagueInput'
      responses:
        '201':
          $ref: '#/components/responses/LeagueResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /leagues/{league}:
    parameters:
      - $ref: '#/components/parameters/LeagueId'
    get:
      tags: [Leagues]
      operationId: getLeague
      summary: Jedna liga
      description: |
        **Uloga:** admin
      x-roles: [admin]
      responses:
        '200':
          $ref: '#/components/responses/LeagueResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Leagues]
      operationId: updateLeague
      summary: Izmjena lige
      description: |
        **Uloga:** admin
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeagueInput'
      responses:
        '200':
          $ref: '#/components/responses/LeagueResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Leagues]
      operationId: deleteLeague
      summary: Brisanje lige
      description: |
        Blokirano ako liga ima izdanja (`409 resource_in_use`).

        **Uloga:** admin
      x-roles: [admin]
      responses:
        '204':
          description: Obrisano
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceInUse'

  # ---------------------------------------------------------------- League editions
  /league-editions:
    get:
      tags: [League editions]
      operationId: listLeagueEditions
      summary: Popis izdanja liga
      description: |
        **Uloga:** admin
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/SeasonFilter'
        - $ref: '#/components/parameters/LeagueFilter'
      responses:
        '200':
          description: Popis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeagueEditionList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [League editions]
      operationId: createLeagueEdition
      summary: Otvaranje lige u sezoni
      description: |
        Par (`league_id`, `season_id`) može postojati samo jednom (inače `422`).

        **Uloga:** admin
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeagueEditionInput'
      responses:
        '201':
          $ref: '#/components/responses/LeagueEditionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /league-editions/{league_edition}:
    parameters:
      - $ref: '#/components/parameters/LeagueEditionId'
    get:
      tags: [League editions]
      operationId: getLeagueEdition
      summary: Jedno izdanje lige
      description: |
        **Uloga:** admin
      x-roles: [admin]
      responses:
        '200':
          $ref: '#/components/responses/LeagueEditionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [League editions]
      operationId: deleteLeagueEdition
      summary: Brisanje izdanja lige
      description: |
        Blokirano ako izdanje ima prijavljene ekipe ili utakmice (`409 resource_in_use`).

        **Uloga:** admin
      x-roles: [admin]
      responses:
        '204':
          description: Obrisano
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceInUse'
  /league-editions/{league_edition}/teams:
    parameters:
      - $ref: '#/components/parameters/LeagueEditionId'
    get:
      tags: [League editions]
      operationId: listLeagueEditionTeams
      summary: Ekipe prijavljene u izdanje lige
      description: |
        **Uloga:** admin
      x-roles: [admin]
      responses:
        '200':
          description: Popis ekipa (bez paginacije)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClubTeam'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [League editions]
      operationId: addLeagueEditionTeam
      summary: Prijava selekcije u izdanje lige
      description: |
        - Selekcija mora biti iste kategorije kao liga.
        - Selekcija se ne može dodati dvaput u isto izdanje.

        **Uloga:** admin
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
